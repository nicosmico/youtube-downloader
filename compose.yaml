# Development environment (ADR-0008). The product itself never runs in Docker.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: app
    init: true
    environment:
      # Dev only: inside the container the server must listen on 0.0.0.0 at a fixed port.
      BIND_HOST: 0.0.0.0
      PORT: "${PORT:-8765}"
      OPEN_BROWSER: "0"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      # Optional: use Engine binaries from this (mounted) directory instead of downloading.
      ENGINE_BIN_DIR: "${ENGINE_BIN_DIR:-}"
      # Idle Shutdown (ADR-0001), in seconds. Off in dev (0) so the container does not stop on
      # its own; set e.g. 20 to try it, or empty for the product default (600).
      IDLE_SHUTDOWN_SECONDS: "${IDLE_SHUTDOWN_SECONDS-0}"
    ports:
      # Published on the host loopback only.
      - "127.0.0.1:${PORT:-8765}:${PORT:-8765}"
    volumes:
      # Never the real ~/.youtube-downloader: the container would fill it with Linux Engine binaries.
      - "${HOST_DATA_DIR:-./.dev-data}:/data"
      - "${HOST_DOWNLOAD_DIR:-${HOME}/Downloads}:/downloads"

  # `docker compose run --rm tests [command]` runs pytest (default), ruff, etc.
  tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    volumes:
      - ./backend:/srv/backend

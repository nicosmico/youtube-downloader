[project]
name = "youtube-downloader"
version = "0.1.0"
description = "Local server for the youtube-downloader desktop app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "truststore>=0.10",
    "certifi>=2024.8.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]
# Native packaging only (CI workflow native.yml); not installed in the dev image.
build = [
    "pyinstaller>=6.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not network'"
markers = ["network: downloads the real Engine (opt-in: pytest -m network)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Native packaging (tickets 12, 13, 14): PyInstaller build of the real app on macOS arm64 (ad-hoc
# signed .app) and Windows x64 (onedir), a smoke test of the built executable (Engine install,
# download, shutdown) and the distributable .zip. PRs and branches only keep the .zip as a
# short-lived artifact; a `v*` tag also publishes both .zip files in a GitHub Release.
name: Native

on:
  push:
    branches: [main, "ticket/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            exe: packaging/dist/YouTube Downloader.app/Contents/MacOS/youtube-downloader
            zip: YouTube-Downloader-macos-arm64.zip
          - os: windows-latest
            name: windows-x64
            exe: packaging/dist/YouTube Downloader/YouTube Downloader.exe
            zip: YouTube-Downloader-windows-x64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Angular build (to backend/app/static)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v5
      - name: Python and dependencies (uv.lock + PyInstaller)
        working-directory: backend
        run: uv sync --frozen --no-dev --group build --python 3.13
      - name: Architecture
        working-directory: backend
        run: uv run --no-sync python -c "import platform,sys; print(platform.machine(), sys.version)"

      - name: PyInstaller (.app on macOS, onedir on Windows)
        working-directory: backend
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: >
          uv run --no-sync pyinstaller --noconfirm
          --distpath ../packaging/dist --workpath ../packaging/build
          ../packaging/youtube-downloader.spec
      - name: Build size
        run: du -sh packaging/dist/*
      - name: Binary architecture (macOS)
        if: runner.os == 'macOS'
        run: file "${{ matrix.exe }}"

      - name: Ad-hoc signature and zip (macOS)
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        run: |
          codesign --force --deep -s - "YouTube Downloader.app"
          codesign --verify --deep --strict --verbose=2 "YouTube Downloader.app"
          # ditto keeps the signature, symlinks and permissions that `zip` would damage.
          ditto -c -k --keepParent "YouTube Downloader.app" "${{ matrix.zip }}"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packaging/dist
        run: Compress-Archive -Path "YouTube Downloader" -DestinationPath "${{ matrix.zip }}"
      - name: Zip size
        run: ls -l "packaging/dist/${{ matrix.zip }}"

      - name: Smoke test (health, Engine ready, open folder, download, shutdown)
        env:
          PYTHONUTF8: "1"
        run: |
          code=0
          uv run --no-project python packaging/smoke.py "${{ matrix.exe }}" || code=$?
          if [ "$code" = 10 ]; then
            echo "::warning::Download skipped: YouTube's bot check blocked this runner's IP. Everything else passed."
            code=0
          fi
          exit $code

      - name: Smoke test reopening the .app with `open` (macOS)
        if: runner.os == 'macOS'
        run: |
          open --help 2>&1 | head -30 || true
          uv run --no-project python packaging/smoke.py --reopen "packaging/dist/YouTube Downloader.app"

      - name: Smoke test without any CA bundle visible to OpenSSL (Engine must still install)
        env:
          PYTHONUTF8: "1"
        run: uv run --no-project python packaging/smoke.py "${{ matrix.exe }}" --empty-ca-store

      - name: Signature still valid after running the app (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "packaging/dist/YouTube Downloader.app"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.zip }}
          path: packaging/dist/${{ matrix.zip }}
          retention-days: 3

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*.zip
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

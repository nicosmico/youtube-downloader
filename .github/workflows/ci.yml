name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker compose build tests
      - name: Lint
        run: docker compose run --rm tests ruff check .
      - name: Format check
        run: docker compose run --rm tests ruff format --check .
      - name: Tests
        run: docker compose run --rm tests pytest

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  image:
    name: App image (backend + Angular build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image served by docker compose up
        run: docker compose build app

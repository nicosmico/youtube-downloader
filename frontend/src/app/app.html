@if (shutdownState() === 'done' || shutdownState() === 'closedIdle') {
  <main class="grid min-h-screen place-items-center px-4">
    <section class="flex max-w-sm flex-col items-center text-center" role="status">
      <span class="grid size-14 place-items-center rounded-2xl bg-accent-solid text-on-accent">
        <app-icon name="arrow-down-to-line" class="size-8" />
      </span>
      <h1 class="mb-2 mt-5 text-xl font-semibold" data-testid="closed-title">
        {{ shutdownState() === 'closedIdle' ? texts.shutdown.idle : texts.shutdown.done }}
      </h1>
      <p class="m-0 text-sm text-muted">{{ texts.shutdown.doneHint }}</p>
    </section>
  </main>
} @else {
  <app-top-bar
    [health]="health()"
    [update]="update()"
    [unreachable]="unreachable()"
    [closing]="shutdownState() === 'closing'"
    (logsRequested)="logsOpen.set(true)"
    (shutdownRequested)="shutdown()"
  />

  @if (shutdownState() === 'failed') {
    <p
      class="mx-auto mt-3 max-w-[1400px] px-4 text-sm text-accent"
      role="alert"
      data-testid="shutdown-error"
    >
      {{ texts.shutdown.failed }}
    </p>
  }

  <main
    class="mx-auto grid max-w-[1400px] grid-cols-1 gap-6 px-4 py-6 wide:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]"
  >
    <app-url-preview />
    <app-downloads />
  </main>

  @if (logsOpen()) {
    <app-logs (closed)="closeLogs()" />
  }
}
